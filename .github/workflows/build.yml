name: Build executables

on:
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tool
        run: python3 -m pip install build
      - name: Build wheel and sdist
        run: python3 -m build
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-sdist
          path: dist/*

  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Debian build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dh-python pybuild-plugin-pyproject \
            python3-setuptools python3-pyqt6 python3-pyqt6.qtsvg
      - name: Build .deb
        run: dpkg-buildpackage -b -uc -us
      - uses: actions/upload-artifact@v4
        with:
          name: debian
          path: |
            tbo_*.deb
            tbo_*.buildinfo
            tbo_*.changes

  build-flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub/flathub-infra:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Flatpak
        run: |
          cd packaging
          flatpak-builder build-dir org.tbo.TBO.json --force-clean
      - name: Export bundle
        run: |
          flatpak build-export export-repo packaging/build-dir
          flatpak build-bundle export-repo org.tbo.TBO.flatpak org.tbo.TBO
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: org.tbo.TBO.flatpak

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 PyQt6-Qt6 Nuitka ordered-set zstandard

      - name: Build standalone executable with Nuitka
        run: |
          python -m nuitka `
            --standalone `
            --enable-plugin=pyqt6 `
            --include-package-data=tbo `
            --include-data-dir=data/doodle=tbo/data/doodle `
            --include-data-dir=translations=tbo/translations `
            --output-filename=tbo.exe `
            --python-path=src `
            src/tbo/__main__.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: tbo-windows
          path: |
            tbo.exe
            tbo.exe.dist/**
