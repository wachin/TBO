name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install project
        run: python3 -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: python3 -m pytest tests/unit

      - name: Integration tests (headless via Xvfb)
        run: xvfb-run -a python3 -m pytest tests/integration

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python3 -m pip install -e '.[dev]'
      - name: Coverage report
        run: python3 -m pytest tests/unit --cov=src/tbo --cov-report=term-missing --cov-fail-under=80